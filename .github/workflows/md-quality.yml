name: Markdown Quality
on:
  pull_request:
    paths: ['**/*.md']
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: npm i -g textlint @textlint/markdown textlint-rule-terminology textlint-rule-no-dead-link
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: |
          cat > .textlintrc.json <<'JSON'
          {
            "rules": {
              "terminology": true,
              "no-dead-link": { "checkRelative": true }
            }
          }
          JSON
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: textlint -f pretty-error '**/*.md'
