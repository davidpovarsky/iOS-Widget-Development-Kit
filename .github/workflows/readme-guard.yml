name: README Guard
on:
  push:
    branches: [ main, master ]
    paths: [ 'README.md' ]
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Create review PR for README change
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Guard: Review README.md change"
          body: "Automated guard: Please review README changes."
          commit-message: "chore: guard README change"
          branch: "chore/readme-guard-${{ github.run_id }}"
          base: "${{ github.ref_name }}"
          add-paths: |
            README.md
